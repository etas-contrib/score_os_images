header:
  version: 18
target:
  - "score-image"
repos:
  meta-score:
    path: meta-score
    layers:
      .:
local_conf_header:
  # Replace the toolkit's default network package (ebclfsa-fastdev-network) by
  # the network configuration shared with //ebclfsa_aarch64_prebuild.
  score_network: |
    EBCLFSA_FASTDEV_NETWORK_CONFIG = "score-network-config"
